<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#F3F1EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Training</title>
<style>
:root{
  --hg:#F3F1EC; --karte:#FFFFFF; --tinte:#1D1C1A; --grau:#7A766F; --linie:#ECE8E1; --spur:#EFECE6; --feld:#F6F4F0;
  --gruen:#1E9E6A; --gruen-t:#E5F5EE; --gelb:#D49A0F; --gelb-t:#FBF2D9; --rot:#E0473B; --rot-t:#FCE9E7;
  --blau:#4F6BED; --radius:18px;
  --schrift:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--hg);color:var(--tinte);font-family:var(--schrift);font-size:16px;line-height:1.4}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px)}
main{max-width:560px;margin:0 auto}
h1{font-size:28px;letter-spacing:-.5px;margin:8px 4px 16px}
.augenbraue{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--grau)}
.karte{background:var(--karte);border-radius:var(--radius);padding:20px;margin-bottom:12px}
.karte>.augenbraue{display:block;margin-bottom:12px}
.leer{color:var(--grau)}
.score-zeile{display:flex;align-items:flex-end;gap:12px;margin-top:8px}
.score{font-size:56px;line-height:56px;font-weight:700;letter-spacing:-2px}
.von{color:var(--grau);padding-bottom:6px}
.pille{display:inline-block;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.p-gruen{background:var(--gruen-t);color:var(--gruen)} .p-gelb{background:var(--gelb-t);color:#B7800C} .p-rot{background:var(--rot-t);color:var(--rot)}
.p-grau{background:var(--spur);color:var(--grau)}
.score-zeile .pille{margin-bottom:10px}
.rat{margin-top:10px}
.spur{height:8px;background:var(--spur);border-radius:8px;margin-top:16px;overflow:hidden}
.spur>i{display:block;height:100%;border-radius:8px}
.tag{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--linie)}
.tag:first-of-type{border-top:0;padding-top:0}
.tag-name{width:72px;flex:none;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--grau);padding-top:2px}
.tag.heute .tag-name{color:var(--tinte)}
.tag-inhalt{flex:1;min-width:0}
.einheit+.einheit{margin-top:14px}
.einheit-kopf{display:flex;align-items:flex-start;gap:8px}
.punkt{width:8px;height:8px;border-radius:8px;flex:none;margin-top:8px}
.einheit-titel{font-weight:650;flex:1}
.einheit-meta{text-align:right;font-size:13px;color:var(--grau);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.einheit-details{font-size:13px;color:var(--grau);margin:2px 0 0 16px}
.variante{margin:8px 0 0 16px;border-radius:12px;padding:9px 11px;font-size:14px;line-height:1.4}
.knopf{appearance:none;border:0;border-radius:12px;font:inherit;font-weight:650;cursor:pointer;padding:12px 16px;background:var(--tinte);color:#fff}
.knopf.klein{padding:8px 12px;font-size:14px}
.knopf.hell{background:var(--spur);color:var(--tinte)}
.knopf.voll{width:100%}
.knopf:disabled{opacity:.5}
.einheit .knopf{margin:10px 0 0 16px}
/* Kraft-Log */
.zurueck{appearance:none;border:0;background:none;font:inherit;color:var(--blau);padding:8px 0;cursor:pointer;font-weight:600}
.station{margin:20px 4px 8px}
.uebung-kopf{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.uebung-name{font-weight:700;font-size:17px}
.hinweis{font-size:13px;color:var(--grau);margin-top:2px}
.saetze{margin-top:12px;display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;align-items:center}
.saetze .kopfzeile{font-size:12px;color:var(--grau);font-weight:600}
.satznr{color:var(--grau);font-size:14px;text-align:center}
.saetze input{width:100%;font:inherit;font-size:17px;font-weight:600;text-align:center;padding:10px 6px;border:1px solid transparent;border-radius:10px;background:var(--feld);color:var(--tinte)}
.saetze input:focus{outline:none;border-color:var(--blau);background:#fff}
.saetze input::placeholder{color:#B9B4AB;font-weight:500}
.entf{appearance:none;border:0;background:none;color:var(--grau);font-size:22px;cursor:pointer;line-height:1;width:36px;height:40px;border-radius:10px}
.entf.ok{color:var(--gruen);background:var(--gruen-t);font-size:18px;font-weight:700}
.satz-plus{margin-top:10px}
.haken{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.haken input{display:none}
.haken .box{width:26px;height:26px;border-radius:8px;border:2px solid #CFCAC1;display:grid;place-items:center;flex:none;transition:.15s}
.haken input:checked+.box{background:var(--gruen);border-color:var(--gruen)}
.haken input:checked+.box::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.leiste{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,var(--hg) 70%,rgba(243,241,236,0))}
.leiste .innen{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.status{font-size:13px;color:var(--grau);flex:1}
.fehler{background:var(--rot-t);color:#9B2C24;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
label.feld{display:block;font-size:13px;color:var(--grau);font-weight:600;margin:14px 0 6px}
input.text{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--linie);background:var(--feld)}
.klein-grau{font-size:13px;color:var(--grau)}
ol.schritte{padding-left:20px;margin:8px 0 0}
ol.schritte li{margin-bottom:6px}
.fuss{text-align:center;margin-top:20px}
/* Check-in */
.frage{margin-top:18px}
.frage:first-of-type{margin-top:4px}
.frage-titel{font-weight:650;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.frage-titel .wert{font-size:20px;font-weight:700}
.segment{display:flex;gap:6px;flex-wrap:wrap}
.segment button{flex:1;min-width:44px;appearance:none;border:0;border-radius:12px;padding:12px 8px;font:inherit;font-weight:650;background:var(--feld);color:var(--tinte);cursor:pointer}
.segment.text button{font-size:14px;font-weight:600}
.segment button.an{background:var(--tinte);color:#fff}
.segment.mehrzeilig button{flex:1 1 30%}
.segment button.an.warn{background:var(--rot);color:#fff}
.skala{display:flex;justify-content:space-between;font-size:12px;color:var(--grau);margin-top:2px}
input[type=range]{width:100%;accent-color:var(--tinte);height:28px}
textarea.text{width:100%;min-height:70px;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--linie);background:var(--feld);resize:vertical}
.checkin-start{display:flex;align-items:center;justify-content:space-between;gap:12px}
.checkin-zeile{font-size:14px;color:var(--grau);display:flex;justify-content:space-between;gap:8px;align-items:center}
.link{appearance:none;border:0;background:none;color:var(--blau);font:inherit;font-weight:600;cursor:pointer;padding:0}
.anpassung{margin-top:12px;font-size:14px;line-height:1.45}
.anpassung li{margin-bottom:4px}
.werte-zeile{font-size:13px;color:var(--grau);margin-top:6px}
/* Zusammensetzung */
.zs{margin-top:16px;border-top:1px solid var(--linie);padding-top:12px}
.zs summary{cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--grau);list-style:none}
.zs summary::-webkit-details-marker{display:none}
.zs summary::after{content:" ▾"}
.zs:not([open]) summary::after{content:" ▸"}
.zs-kopf,.zs-zeile{display:grid;grid-template-columns:1.15fr 1.25fr 1fr 40px;gap:8px;align-items:center}
.zs-kopf{font-size:11px;color:var(--grau);margin:10px 0 2px}
.zs-kopf span:last-child,.zs-punkte{text-align:right}
.zs-zeile{padding:8px 0;border-top:1px solid var(--linie);font-size:14px}
.zs-name{display:flex;flex-direction:column;line-height:1.25}
.zs-name span{font-size:12px;color:var(--grau)}
.zs-schnitt{display:block;font-size:12px;color:var(--grau);white-space:nowrap}
.zs-balken{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--grau)}
.spur.klein{height:5px;margin:0;flex:1}
.zs-punkte{font-weight:700}
.zs-summe{display:flex;justify-content:space-between;border-top:2px solid var(--tinte);padding-top:8px;margin-top:2px;font-size:15px}
.fuss button{appearance:none;border:0;background:none;color:var(--grau);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
/* Reiter */
.reiter{display:inline-flex;background:var(--spur);border-radius:12px;padding:3px;gap:2px;margin:4px 0 6px}
.reiter button{appearance:none;border:0;background:none;font:inherit;font-size:14px;font-weight:650;color:var(--grau);padding:7px 16px;border-radius:9px;cursor:pointer}
.reiter-zeile{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sync{appearance:none;border:0;background:none;font:inherit;font-size:13px;color:var(--grau);cursor:pointer;padding:6px 2px;display:inline-flex;align-items:center;gap:6px;text-align:right}
.sync b{color:var(--tinte);font-weight:650}
.sync:disabled{cursor:default}
.sync .dreh{display:inline-block}
.sync.laeuft .dreh{animation:dreh 1s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}
.reiter button.an{background:var(--karte);color:var(--tinte);box-shadow:0 1px 2px rgba(0,0,0,.06)}
/* Kalender */
.k-nav{display:flex;align-items:center;gap:10px;margin:10px 4px 16px;flex-wrap:wrap}
.k-nav h1{white-space:nowrap}
#k-planen{width:auto;height:40px;padding:0 16px;font-size:14px}
@media (max-width: 899px){ #k-planen{order:9;flex-basis:100%;margin-left:0 !important} }
.k-nav .knopf{width:40px;height:40px;padding:0;font-size:20px}
.k-woche{display:flex;flex-direction:column;gap:8px}
.k-tag{background:var(--karte);border-radius:16px;padding:12px 14px}
.k-tag.heute .k-kopf span{color:var(--tinte)}
.k-tag.vorbei{opacity:.75}
.k-kopf{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--grau);margin-bottom:6px}
.k-tag.heute .k-kopf{color:var(--tinte)}
.k-plus{appearance:none;border:0;background:var(--spur);color:var(--tinte);width:28px;height:28px;border-radius:8px;font-size:18px;line-height:1;cursor:pointer}
.k-einheit{appearance:none;border:0;background:var(--feld);width:100%;display:flex;align-items:center;gap:10px;text-align:left;font:inherit;color:var(--tinte);padding:10px 12px;border-radius:12px;cursor:pointer;margin-top:6px}
.k-einheit .punkt{margin-top:0}
.k-text{flex:1;min-width:0;display:flex;flex-direction:column}
.k-titel{font-weight:650}
.k-meta{font-size:12px;color:var(--grau)}
.k-einheit.gestrichen .k-titel{text-decoration:line-through;color:var(--grau)}
.k-einheit.fertig{background:var(--gruen-t)}
.k-akt{display:flex;align-items:center;gap:10px;color:var(--tinte);padding:8px 12px;margin-top:6px}
.k-akt .k-titel{font-weight:600;color:var(--grau);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-akt .punkt{margin-top:0}
.k-leer{font-size:14px;padding:4px 0}
/* Detail unter dem Kalender */
.k-einheit.gewaehlt,.k-akt.gewaehlt{box-shadow:inset 0 0 0 2px var(--tinte)}
button.k-akt{appearance:none;border:0;background:none;font:inherit;width:100%;text-align:left;border-radius:12px;cursor:pointer}
.detail h2{font-size:26px;margin:4px 0 6px;display:flex;align-items:center;gap:10px;letter-spacing:-.3px}
.detail h2.durch{text-decoration:line-through;color:var(--grau)}
.punkt.gross{width:12px;height:12px;border-radius:12px;margin:0;flex:none}
.d-meta{color:var(--grau);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.d-text{font-size:16px;line-height:1.5;margin:14px 0 0}
.d-verlauf{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.d-verlauf span{background:var(--spur);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--grau)}
.d-abschnitt{margin-top:18px}
.d-abschnitt>.augenbraue{display:block;margin-bottom:8px}
.d-variante{border-left:4px solid;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--feld);font-size:15px;line-height:1.45}
.d-variante b{display:block;font-size:13px;margin-bottom:2px}
.d-variante.gross{font-size:17px;line-height:1.5;padding:14px 16px}
.d-mehr{margin-top:16px}
ul.punkte{margin:4px 0 0;padding-left:18px}
ul.punkte li{margin:3px 0}
.d-text ul.punkte{margin-top:14px;font-size:16px}
.d-variante.gross ul.punkte li{margin:5px 0}
.einheit-details ul.punkte{margin-top:2px}
.d-mehr summary{cursor:pointer;color:var(--blau);font-weight:600;font-size:14px;list-style:none;margin-bottom:10px}
.d-mehr summary::-webkit-details-marker{display:none}
.d-mehr summary::after{content:" ▸"}
.d-mehr[open] summary::after{content:" ▾"}
.d-werte{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.d-werte div{background:var(--feld);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.d-werte span{font-size:12px;color:var(--grau)}
.d-werte b{font-size:18px}
.zonen{display:flex;flex-direction:column;gap:6px}
.zone{display:grid;grid-template-columns:28px 1fr 56px;gap:8px;align-items:center;font-size:13px;color:var(--grau)}
.zone-min{text-align:right}
.d-uebung{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--linie);font-size:14px}
.d-uebung b{text-align:right}
.u-extras{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{appearance:none;border:1px solid var(--linie);background:none;font:inherit;font-size:13px;color:var(--grau);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip.an{background:var(--gelb-t);border-color:var(--gelb);color:var(--tinte);font-weight:600}
.u-notiz{width:100%;margin-top:8px;min-height:44px}
.karte.spaeter{opacity:.75}
.karte.spaeter .uebung-name::after{content:" · später";color:#B7800C;font-weight:600;font-size:13px}
.notiz-zeile{font-size:13px;color:var(--grau);font-style:italic;margin-top:2px}
.d-notiz{background:var(--spur);border-radius:10px;padding:9px 12px;font-size:14px;margin-top:10px;white-space:pre-wrap}
.rest-karte{border:2px solid var(--gelb)}
/* Fortschritt */
.f-countdown{font-size:15px;color:var(--grau);margin:-4px 0 14px}
.f-countdown b{color:var(--tinte);font-size:22px;font-weight:750;margin-right:2px}
.f-hero{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.f-titel{font-size:19px;font-weight:700;margin-top:2px}
.f-fortschritt{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:14px;white-space:nowrap}
.f-fortschritt .spur{flex:1;margin:0}
.f-fortschritt .spur>div{height:100%;border-radius:8px}
.f-unter{font-size:13px;font-weight:650;color:var(--grau);margin:18px 0 8px}
.f-zeile{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--linie);font-size:14px}
.f-zeile b{text-align:right}
.f-meilenstein{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--linie);font-size:14px}
.f-punkt{width:12px;height:12px;border-radius:50%;border:2px solid #8B5CF6}
.f-punkt.ok{background:#8B5CF6}
.f-punkt.spaet{border-color:var(--rot)}
.f-prognose{text-align:right;font-size:12px;color:var(--grau);line-height:1.3}
.f-prognose b{font-size:14px;color:var(--tinte)}
.f-kacheln{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.f-kacheln div{background:var(--feld);border-radius:12px;padding:12px}
.f-kacheln b{display:block;font-size:22px;font-weight:750}
.f-kacheln span{font-size:12px;color:var(--grau)}
.f-kraft{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--linie);font-size:14px}
.f-kraft-wert{text-align:right}
.f-kraft-wert b{display:block}
.f-kraft-wert span{font-size:12px;color:var(--grau)}
.f-kraft-wert span.plus{color:var(--gruen);font-weight:650}
.f-infekt{background:var(--feld);border-radius:12px;padding:12px;font-size:14px;margin-bottom:6px}
.f-tabelle{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.f-tabelle th,.f-tabelle td{text-align:right;padding:5px 4px;border-top:1px solid var(--linie)}
.f-tabelle th:first-child,.f-tabelle td:first-child{text-align:left}
.c-chart{margin-top:4px}
.c-flaeche{position:relative;display:flex;gap:3px;height:calc(var(--h) + 30px);align-items:stretch}
.c-unten{height:30px;display:flex;flex-direction:column;align-items:center}
.c-spalte{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;cursor:pointer;outline:none;border-radius:6px}
.c-saeule{height:var(--h);width:100%;max-width:26px;display:flex;flex-direction:column-reverse;gap:2px;border-bottom:1px solid #D9D4CB}
.c-seg{width:100%;flex:none}
.c-seg:last-child{border-radius:4px 4px 0 0}
.c-spalte.aktiv .c-saeule,.c-spalte:hover .c-saeule{filter:brightness(.92)}
.c-spalte.aktiv{background:var(--feld)}
.c-marke{width:7px;height:7px;border-radius:50%;background:var(--rot);margin-top:4px;flex:none}
.c-marke.leer{background:none}
.c-label{font-size:10px;color:var(--grau);margin-top:3px;white-space:nowrap}
.c-spalte:nth-child(even) .c-label{visibility:hidden}
.c-ziel{position:absolute;left:0;right:0;border-top:2px dashed #8B5CF6;pointer-events:none}
.c-ziel span{position:absolute;right:0;top:-20px;font-size:11px;font-weight:650;background:var(--karte);padding:0 4px;color:var(--tinte)}
.c-legende{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--grau);margin-top:10px}
.c-legende i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.c-legende i.c-marke-l{background:var(--rot);border-radius:50%;width:7px;height:7px}
.c-tip{position:absolute;z-index:40;background:var(--tinte);color:#fff;font-size:13px;line-height:1.45;padding:8px 11px;border-radius:10px;pointer-events:none;max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.meldung{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tinte);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:15px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.18);transition:opacity .4s}
.d-aktionen{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.d-aktionen .knopf{flex:1 1 40%}

/* Ruhetag */
.k-ruhe{appearance:none;border:0;background:none;font:inherit;color:var(--grau);width:100%;text-align:left;padding:8px 12px;border-radius:12px;cursor:pointer;margin-top:2px}
.k-ruhe:hover{background:var(--feld)}
.k-ruhe.gewaehlt{box-shadow:inset 0 0 0 2px var(--tinte);color:var(--tinte)}
.ruhe .ruhe-bild{display:flex;justify-content:center;margin:8px 0 4px}
.ruhe-heute{display:flex;gap:12px;align-items:center}
.ruhe-heute svg{flex:none;width:110px}

/* Wochenplanung */
.wp-zahlen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wp-zahlen div{background:var(--feld);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.wp-zahlen b{font-size:20px}
.wp-zahlen span{font-size:12px;color:var(--grau);line-height:1.3}
.wp-zeile{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.wp-chip{display:inline-flex;align-items:center;gap:6px;background:var(--feld);border-radius:999px;padding:4px 10px;font-size:13px}
.wp-chip .punkt{margin:0}
.wp-hinweis{display:inline-block;background:var(--gelb-t);border-radius:999px;padding:4px 10px;font-size:13px;margin:10px 6px 0 0}
.wp-tag{padding:8px 0;border-top:1px solid var(--linie);display:grid;grid-template-columns:62px minmax(0,1fr);gap:4px 8px;align-items:center}
.wp-tag .wp-tag-name{margin:0;color:var(--tinte)}
.wp-tag .wp-tag-name span{display:block;font-size:11px;font-weight:600;color:var(--grau);letter-spacing:0}
.wp-tag .wp-flags{grid-column:2;margin-top:0}
.wp-tag:first-of-type{border-top:0}

.wp-zeit{flex-wrap:nowrap;gap:4px}
.wp-zeit button{padding:8px 2px;font-size:12px;min-width:0;border-radius:10px}
.wp-flags button{padding:3px 10px !important;font-size:12px !important}
.wp-flags{display:flex;gap:6px;margin-top:6px}
.wp-flags button{appearance:none;border:1px solid var(--linie);background:none;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;color:var(--grau);cursor:pointer}
.wp-flags button.an{background:var(--tinte);border-color:var(--tinte);color:#fff}
.wp-vtag{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--linie)}

.wp-einheit{display:flex;align-items:center;gap:10px;background:var(--feld);border-radius:12px;padding:8px 10px}

.wp-einheit .punkt{margin:0}
.wp-einheit.fest{opacity:.7}

.wp-einheit[data-wp-key]{cursor:pointer}
.wp-kopf{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.wp-kopf .augenbraue{margin:0}
.wp-einheit[data-wp-key]:hover{box-shadow:inset 0 0 0 1px #CFCAC1}
.wp-einheit.manuell{box-shadow:inset 0 0 0 2px var(--tinte)}
.tag-wahl button:disabled{opacity:.4;cursor:not-allowed}
.wp-vtag .wp-tag-name span{display:block;font-size:11px;font-weight:600;letter-spacing:0;color:var(--grau);text-transform:none}
.wp-vtag.geaendert{animation:aufleuchten 1.2s ease-out}
@keyframes aufleuchten{0%{background:#FFF3C4}100%{background:transparent}}

/* Bottom-Sheet */

.sheet-hg{position:absolute;inset:0;background:rgba(29,28,26,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--karte);border-radius:20px 20px 0 0;
  padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);max-width:560px;margin:0 auto;animation:hoch .18s ease-out}

/* Breite Bildschirme (Laptop, iPad quer): mehrspaltig. Am Handy bleibt alles einspaltig. */

  main,.leiste .innen{max-width:1100px}
  h1{font-size:34px;margin-bottom:20px}
  .raster{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}

  .k-woche{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:stretch}
  .k-tag{min-height:160px;padding:10px}
  .k-einheit{padding:9px 10px;display:grid;grid-template-columns:8px minmax(0,1fr);gap:4px 8px;align-items:start}
  .k-einheit .punkt{margin-top:7px}
  .k-einheit .pille{grid-column:2;justify-self:start;font-size:10px;padding:3px 7px}

  .wp-tag{grid-template-columns:70px minmax(0,1fr) auto}

  .k-akt{display:grid;grid-template-columns:8px minmax(0,1fr);gap:8px;align-items:start;padding:8px 10px;font-size:13px;line-height:1.3}

  .d-aktionen .knopf{flex:0 0 auto;padding:10px 18px}
  .d-werte{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:20px;animation:none;max-width:520px}
}

<body>
<main id="app"><div class="karte leer">Lade …</div></main>
<div class="leiste" id="leiste" hidden><div class="innen"><span class="status" id="status"></span><button class="knopf" id="speichern">Speichern</button></div></div>

<script>
"use strict";
// ---------- Konfiguration ----------
const REPO = "GarminUserVS/trainings-daten";
const API = "https://api.github.com/repos/" + REPO + "/contents/";
const TOKEN_KEY = "trainings_token";
const ENTWURF_KEY = "trainings_entwurf_";

const WOCHENTAGE = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const SPORT_FARBEN = {laufen:"#8B5CF6", rad:"#F08A24", schwimmen:"#2F8FD8", kraft:"#3D3A36", mobilitaet:"#20A39E", sonstiges:"#BDB7AD"};
const AMPEL = {
  gruen:{wort:"Grün", klasse:"p-gruen", farbe:"var(--gruen)", tint:"var(--gruen-t)"},
  gelb:{wort:"Gelb", klasse:"p-gelb", farbe:"var(--gelb)", tint:"var(--gelb-t)"},
  rot:{wort:"Rot", klasse:"p-rot", farbe:"var(--rot)", tint:"var(--rot-t)"}
};
const RAT = {
  gruen:"Volles Training wie geplant.",
  gelb:"Umfang oder Intensität reduzieren – z. B. Intervalle kürzen oder in Grundlage umwandeln.",
  rot:"Ruhe oder aktive Erholung (lockere Bewegung, Mobility). Harte Einheit verschieben."
};
const INTENSITAET = {locker:"p-gruen", mittel:"p-gelb", hart:"p-rot"};

// ---------- Hilfen ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function isoDatum(d){ const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
function plusTage(iso, n){ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return isoDatum(d); }
function tagLabel(iso, i){ if(i===0) return "Heute"; if(i===1) return "Morgen"; const d=new Date(iso+"T12:00:00"); return WOCHENTAGE[d.getDay()]+" "+iso.slice(8,10)+"."+iso.slice(5,7)+"."; }
function lies(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function schreib(key, wert){ try{ wert===null ? localStorage.removeItem(key) : localStorage.setItem(key, wert); }catch(e){} }
const HEUTE = isoDatum(new Date());
function token(){ return (lies(TOKEN_KEY) || "").replace(/[^\x21-\x7E]/g, ""); }
// Übungen/Intervalle können als Liste gespeichert sein: dann untereinander anzeigen
function inhalt(x){
  if(Array.isArray(x)) return `<ul class="punkte">${x.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
  return esc(x);
}
function alsText(x){ return Array.isArray(x) ? x.join(" · ") : (x || ""); }

// ---------- GitHub-Zugriff ----------
function b64zuText(b64){ const bin=atob(b64.replace(/\n/g,"")); const bytes=Uint8Array.from(bin, c=>c.charCodeAt(0)); return new TextDecoder().decode(bytes); }
function textZuB64(text){ const bytes=new TextEncoder().encode(text); let bin=""; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); }

async function gh(pfad, opt={}){
  const tk = token();
  const res = await fetch(API + pfad + (opt.method ? "" : "?ref=main&t=" + Date.now()), {
    method: opt.method || "GET",
    cache: "no-store",
    headers: {"Authorization":"Bearer "+tk, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"},
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  return res;
}
async function ladeJson(pfad, standard){
  const res = await gh(pfad);
  if(res.status===404) return {daten: standard, sha: null};
  if(res.status===401) throw new Error("token");
  if(!res.ok) throw new Error("GitHub antwortet mit " + res.status + " für " + pfad);
  const j = await res.json();
  return {daten: JSON.parse(b64zuText(j.content)), sha: j.sha};
}
// Liest die aktuelle Datei, wendet die Änderung an und schreibt zurück; bei Konflikt neu versuchen.
async function aendere(pfad, standard, aenderung, nachricht){
  for(let versuch=0; versuch<3; versuch++){
    const {daten, sha} = await ladeJson(pfad, standard);
    const neu = aenderung(structuredClone(daten));
    const body = {message: nachricht, content: textZuB64(JSON.stringify(neu, null, 1) + "\n"), branch: "main"};
    if(sha) body.sha = sha;
    const res = await gh(pfad, {method:"PUT", body});
    if(res.ok) return neu;
    if(res.status!==409 && res.status!==422) throw new Error("Speichern fehlgeschlagen (" + res.status + ")");
  }
  throw new Error("Speichern fehlgeschlagen: Datei wurde gleichzeitig geändert. Bitte nochmal versuchen.");
}

// ---------- Zustand ----------
const zustand = {status:{}, ansicht:"heute", plan:[], bericht:null, uebungen:{}, kraft:[], checkins:[], aktivitaeten:[], einstellungen:{}, wochen:[]};

async function pruefeZugriff(){
  const res = await fetch("https://api.github.com/repos/" + REPO, {cache:"no-store",
    headers:{"Authorization":"Bearer "+token(), "Accept":"application/vnd.github+json"}});
  if(res.status===401) throw new Error("token");
  if(res.status===403 || res.status===404) throw new Error("zugriff");
  if(!res.ok) throw new Error("GitHub antwortet mit " + res.status);
  const j = await res.json();
  if(j.permissions && !j.permissions.push) throw new Error("schreibrecht");
}

async function ladeAlles(){
  await pruefeZugriff();
  const [plan, bericht, uebungen, kraft, checkins, aktivitaeten, einstellungen, wochen, status] = await Promise.all([
    ladeJson("daten/plan.json", []),
    ladeJson("daten/berichte/" + HEUTE + ".json", null),
    ladeJson("daten/uebungen.json", {}),
    ladeJson("daten/kraft.json", []),
    ladeJson("daten/checkins.json", []),
    ladeJson("daten/aktivitaeten.json", []),
    ladeJson("einstellungen.json", {}),
    ladeJson("daten/wochen.json", []),
    ladeJson("daten/status.json", {})
  ]);

  zustand.plan = plan.daten; zustand.bericht = bericht.daten; zustand.uebungen = uebungen.daten; zustand.kraft = kraft.daten;
  zustand.checkins = checkins.daten; zustand.aktivitaeten = aktivitaeten.daten; zustand.einstellungen = einstellungen.daten; zustand.wochen = wochen.daten;
  zustand.status = status.daten || {};
}

// ---------- Ansichten ----------
function zeigeEinrichtung(fehler){
  $("#leiste").hidden = true;
  $("#app").innerHTML = `
    <h1>Training</h1>
    ${fehler ? `<div class="fehler">${esc(fehler)}</div>` : ""}
    <div class="karte">
      <span class="augenbraue">Einmalig einrichten</span>
      <p style="margin:0">Die App liest und speichert deine Daten im privaten Repository <b>trainings-daten</b>. Dafür braucht sie einen Zugangsschlüssel von GitHub, der nur auf diesem Gerät gespeichert wird.</p>
      <label class="feld" for="token">GitHub-Token</label>
      <input class="text" id="token" type="password" autocomplete="off" placeholder="github_pat_…">
      <button class="knopf voll" id="token-ok" style="margin-top:14px">Verbinden</button>
      <p class="klein-grau" style="margin-top:14px">Auf jedem Gerät, auf dem du die App nutzt, einmal eingeben.</p>
    </div>`;
  $("#token-ok").onclick = async () => {
    const t = $("#token").value.replace(/[^\x21-\x7E]/g, "");
    if(!t) return;
    schreib(TOKEN_KEY, t);
    start();
  };
}

// ---------- Tages-Ampel: Garmin-Werte + Check-in (das Gefühl hat Vorrang) ----------
const RANG = {rot:0, gelb:1, gruen:2};
const INFEKT = {nein:"Nein", ober:"Nur oberhalb des Halses", unter:"Unterhalb des Halses oder Fieber"};
const SCHNELL = {muede:"Müde", muskelkater:"Muskelkater", wenig_zeit:"Wenig Zeit"};
function checkinHeute(){ return zustand.checkins.find(c => c.datum===HEUTE) || null; }
function liefGestern(){
  const gestern = plusTage(HEUTE, -1);
  return zustand.aktivitaeten.some(a => a.datum===gestern && a.sport==="laufen")
      || zustand.plan.some(e => e.datum===gestern && e.sport==="laufen" && e.status==="erledigt");
}
function tagesAmpel(){
  const b = zustand.bericht, c = checkinHeute();
  const t = {garmin: b ? b.farbe : null, score: b ? b.score : null, farbe: b ? b.farbe : null, gruende: [], hinweise: [],
             laufsperre: false, wenigZeit: false, checkin: c};
  if(!c) return t;
  const deckel = (farbe, grund) => {
    t.gruende.push(grund);
    if(t.farbe===null || RANG[farbe] < RANG[t.farbe]) t.farbe = farbe;
  };
  if(c.infekt==="unter") deckel("rot", "Infektgefühl unterhalb des Halses bzw. Fieber");
  if(c.infekt==="ober"){ deckel("gelb", "Infektgefühl oberhalb des Halses"); t.hinweise.push("Nur Zone 1–2, keine Intervalle."); }
  if(c.energie!==null && c.energie<=2) deckel("gelb", "Energie niedrig (" + c.energie + "/5)");
  if((c.knie ?? 0) > 3 || (c.huefte ?? 0) > 3){
    t.laufsperre = true;
    t.hinweise.push("Knie oder Hüfte über 3/10: kein Lauf heute – locker Rad oder Schwimmen als Ersatz.");
  }
  if(c.knie_ruhig===false) t.hinweise.push("Knie war nach dem letzten Lauf nicht ruhig: Laufdauer nicht steigern.");
  if((c.schnell||[]).includes("wenig_zeit")){ t.wenigZeit = true; }
  if((c.schnell||[]).includes("muede") && t.farbe==="gruen") t.hinweise.push("Müde trotz guter Werte: Intensität lieber etwas rausnehmen.");
  return t;
}

function planenKarte(){
  const wt = new Date(HEUTE+"T12:00:00").getDay();  // 0 = So, 6 = Sa
  const naechste = plusTage(montag(HEUTE), 7);
  if(![0,6].includes(wt) || zustand.wochen.some(w => w.start===naechste)) return "";
  return `<div class="karte checkin-start"><div><span class="augenbraue">${wt===0 ? "Heute ist Sonntag" : "Wochenende"}</span>
    <div style="margin-top:6px">Zeit, die nächste Woche zu planen.</div></div>
    <button class="knopf" id="zur-planung">Planen</button></div>`;
}
function checkinKarte(t){
  const c = t.checkin;
  if(!c) return `<div class="karte checkin-start"><div><span class="augenbraue">Morgen-Check-in</span>
      <div style="margin-top:6px">Wie fühlst du dich heute?</div></div>
      <button class="knopf" id="zum-checkin">Check-in</button></div>`;
  const teile = ["Energie " + c.energie + "/5", "Knie " + (c.knie ?? 0), "Hüfte " + (c.huefte ?? 0)];
  if(c.infekt && c.infekt!=="nein") teile.push("Infekt");
  (c.schnell||[]).forEach(k => teile.push(SCHNELL[k]));
  return `<div class="karte"><div class="checkin-zeile"><span><b style="color:var(--tinte)">Check-in:</b> ${esc(teile.join(" · "))}</span>
    <button class="link" id="zum-checkin">Ändern</button></div></div>`;
}

function ampelKarte(t){
  if(!t.farbe) return `<div class="karte"><span class="augenbraue">Bereitschaft</span><div class="leer">Der Morgenbericht für heute ist noch nicht da – er kommt, sobald deine Uhr den Schlaf synchronisiert hat.</div></div>`;
  const a = AMPEL[t.farbe];
  const angepasst = t.garmin && t.farbe!==t.garmin;
  const kopf = t.score!==null
    ? `<span class="score">${t.score}</span><span class="von">/ 100</span>`
    : `<span class="score" style="font-size:32px;line-height:40px">Check-in</span>`;
  const anpassung = (t.gruende.length || t.hinweise.length)
    ? `<ul class="anpassung" style="padding-left:18px;margin-bottom:0">${
        (angepasst ? [`Angepasst von ${AMPEL[t.garmin].wort} auf ${a.wort}: ${t.gruende.join(", ")}.`] : [])
        .concat(t.hinweise).map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : "";
  return `<div class="karte">
    <span class="augenbraue">Bereitschaft heute</span>
    <div class="score-zeile">${kopf}<span class="pille ${a.klasse}">● ${a.wort}</span></div>
    <div class="rat">${esc(RAT[t.farbe])}</div>${anpassung}
    ${t.score!==null ? `<div class="spur"><i style="width:${Math.max(0,Math.min(100,t.score))}%;background:${AMPEL[t.garmin].farbe}"></i></div>` : ""}
    ${angepasst ? `<div class="werte-zeile">Garmin-Werte allein: ${t.score} · ${AMPEL[t.garmin].wort}</div>` : ""}
    ${zusammensetzung()}
  </div>`;
}

const KURZNAME = {hrv:"HRV", ruhepuls:"Ruhepuls", schlaf:"Schlaf", body_battery:"Body Battery"};
// Aus welchen Werten sich die Bereitschaft zusammensetzt
function zusammensetzung(){
  const b = zustand.bericht;
  if(!b || !b.signale) return "";
  const gewichte = b.gewichte || (zustand.einstellungen.ampel || {}).gewichte || {};
  const zahl = x => typeof x==="number" ? String(Math.round(x*10)/10).replace(".", ",") : "–";
  let zeilen = "";
  for(const [k, s] of Object.entries(b.signale)){
    const g = gewichte[k] ?? 0;
    const punkte = Math.round(g * s.teilwert);
    const diff = (s.schnitt && s.wert!==s.schnitt) ? Math.abs(s.wert - s.schnitt) / s.schnitt >= 0.05 : false;
    const besser = (s.wert > s.schnitt) === (s.hoeher_besser !== false);
    const pfeil = s.schnitt && s.wert!==s.schnitt ? (s.wert > s.schnitt ? "▲" : "▼") : "";
    const pfeilFarbe = !diff ? "var(--grau)" : (besser ? "var(--gruen)" : "var(--rot)");
    const balken = s.teilwert >= 50 ? "var(--gruen)" : s.teilwert >= 40 ? "var(--gelb)" : "var(--rot)";
    zeilen += `<div class="zs-zeile">
      <div class="zs-name"><b>${esc(KURZNAME[k] || s.name)}</b><span>${Math.round(g*100)} %</span></div>
      <div class="zs-wert">${zahl(s.wert)}${s.einheit ? " " + esc(s.einheit) : ""} <span style="color:${pfeilFarbe}">${pfeil}</span> <span class="zs-schnitt">Ø ${zahl(s.schnitt)}</span></div>
      <div class="zs-balken"><div class="spur klein"><i style="width:${Math.max(0,Math.min(100,s.teilwert))}%;background:${balken}"></i></div><span>${s.teilwert}</span></div>
      <div class="zs-punkte">+${punkte}</div>
    </div>`;
  }
  return `<details class="zs" open>
    <summary>Zusammensetzung</summary>
    <div class="zs-kopf"><span>Signal · Gewicht</span><span>heute</span><span>Teilwert</span><span>Punkte</span></div>
    ${zeilen}
    <div class="zs-summe"><span>Bereitschaft</span><b>${b.score}</b></div>
    <p class="klein-grau" style="margin:10px 0 0">HRV und Ruhepuls werden mit deinem 4-Wochen-Schnitt verglichen: 50 heißt „wie üblich“, je deutlicher die Abweichung, desto weiter nach oben oder unten. Schlaf-Score und Body Battery gehen direkt als Wert ein. Punkte = Teilwert × Gewicht.</p>
  </details>`;
}

// Was heute für eine Einheit gilt (wie scripts/plan.py, plus Check-in)
function heuteFuer(e, t){
  if(e.sport==="laufen" && t.laufsperre)
    return {label:"Heute kein Lauf:", text:"Knie oder Hüfte über 3/10 – stattdessen locker Rad oder Schwimmen.", farbe:"rot"};
  if(!t.farbe) return null;
  const v = e.varianten || {};
  if(t.wenigZeit && t.farbe==="gruen" && v.gelb) return {label:"Kurzversion (wenig Zeit):", text:v.gelb, farbe:"gelb"};
  if(v[t.farbe]) return {label:`Heute bei ${AMPEL[t.farbe].wort}:`, text:v[t.farbe], farbe:t.farbe};
  const hart = e.intensitaet==="hart" || ["kraft_tag_a","rad_schwelle","langer_lauf"].includes(e.art);
  if(t.farbe==="rot" && hart) return {label:"Vorschlag:", text:"Verschieben oder als lockere Einheit in Zone 1–2 machen.", farbe:"rot"};
  if(t.farbe==="rot" && ["laufen","rad","schwimmen"].includes(e.sport)) return {label:"Vorschlag:", text:"Wenn überhaupt: kurz und sehr locker.", farbe:"rot"};
  if(t.farbe==="gelb" && hart) return {label:"Vorschlag:", text:"Kürzen oder Intensität rausnehmen, z. B. eine Wiederholung weniger.", farbe:"gelb"};
  if(t.wenigZeit) return {label:"Wenig Zeit:", text:"Kernteil machen, Ein- und Auslaufen bzw. Zusatzübungen kürzen.", farbe:"gelb"};
  return null;
}
function varianteHtml(h, stil=""){
  return `<div class="variante" style="${stil}background:${AMPEL[h.farbe].tint}"><b>${esc(h.label)}</b> ${inhalt(h.text)}</div>`;
}

function einheitHtml(e, istHeute){
  const farbe = SPORT_FARBEN[e.sport] || "#BDB7AD";
  const umfang = e.dauer_min ? e.dauer_min + " min" : (e.umfang || "");
  const pille = e.intensitaet ? `<span class="pille ${INTENSITAET[e.intensitaet]||"p-grau"}">${esc(e.intensitaet)}</span>` : "";
  // Heute die volle Liste; kommende Tage ohne Details (die stehen im Kalender)
  let unten = e.details && istHeute ? `<div class="einheit-details">${inhalt(e.details)}</div>` : "";
  const h = istHeute ? heuteFuer(e, tagesAmpel()) : null;
  if(h) unten = varianteHtml(h);
  const kraftArt = e.art && zustand.uebungen[e.art] ? e.art : null;
  const log = kraftArt && zustand.kraft.find(k => k.datum===e.datum && k.einheit===kraftArt);
  const knopf = kraftArt && e.datum<=HEUTE
    ? `<button class="knopf klein ${log ? "hell" : ""}" data-log="${esc(e.id)}">${log ? "Eintrag ansehen" : "Training eintragen"}</button>` : "";
  return `<div class="einheit">
    <div class="einheit-kopf"><span class="punkt" style="background:${farbe}"></span>
      <span class="einheit-titel">${esc(e.titel)}</span>
      <span class="einheit-meta">${esc(umfang)}${pille}</span></div>
    ${unten}${knopf}</div>`;
}

// ---------- Kraft-Log ----------
function letzteWerte(uebungId, vorDatum){
  const frueher = zustand.kraft.filter(k => k.datum < vorDatum && k.uebungen && k.uebungen[uebungId] && k.uebungen[uebungId].saetze)
    .sort((a,b) => a.datum < b.datum ? 1 : -1);
  return frueher.length ? {datum: frueher[0].datum, saetze: frueher[0].uebungen[uebungId].saetze} : null;
}
function kurz(saetze){ return saetze.map(s => (s.wdh ?? "–") + (s.kg ? "×" + String(s.kg).replace(".", ",") + " kg" : "")).join(", "); }

function startwerte(einheitArt, datum){
  const vorhanden = zustand.kraft.find(k => k.datum===datum && k.einheit===einheitArt);
  const entwurf = lies(ENTWURF_KEY + datum + "_" + einheitArt);
  if(entwurf){ try{ return JSON.parse(entwurf); }catch(e){} }
  const werte = {};
  for(const u of zustand.uebungen[einheitArt].uebungen){
    const v = vorhanden && vorhanden.uebungen[u.id];
    if(u.erfassung==="abhaken"){ werte[u.id] = {erledigt: !!(v && v.erledigt)}; }
    else if(v && v.saetze){ werte[u.id] = {saetze: structuredClone(v.saetze)}; }
    else {
      const letzte = letzteWerte(u.id, datum);
      const vorlage = letzte ? letzte.saetze : (u.ziel || [{}, {}, {}]);
      // Vorschlag als Platzhalter, damit erst eigene Eingaben zählen
      werte[u.id] = {saetze: vorlage.map(s => ({wdh:null, kg:null, v_wdh:s.wdh ?? null, v_kg:s.kg ?? null}))};
    }
    if(v && v.spaeter) werte[u.id].spaeter = true;
    if(v && v.notiz) werte[u.id].notiz = v.notiz;
  }
  werte._notiz = (vorhanden && vorhanden.notiz) || "";
  return werte;
}

let offen = null; // {eintrag, art, werte}
let kamVonKalender = false;

function zeigeKraftLog(planId){
  kamVonKalender = !!document.querySelector(".k-woche");
  const e = zustand.plan.find(x => x.id===planId);
  const art = e.art;
  const def = zustand.uebungen[art];
  offen = {eintrag:e, art, werte: startwerte(art, e.datum)};
  const h = e.datum===HEUTE ? heuteFuer(e, tagesAmpel()) : null;
  const variante = h ? varianteHtml(h, "margin:0 0 12px;") : "";

  let html = `<button class="zurueck" id="zurueck">‹ Übersicht</button>
    <h1 style="margin-top:4px">${esc(def.name)}</h1>${variante}`;
  let station = null;
  for(const u of def.uebungen){
    if(u.station!==station){
      if(station!==null) html += `</div>`;
      station = u.station; html += `<div class="augenbraue station">${esc(station)}</div><div class="gruppe">`;
    }
    html += `<div class="karte ${offen.werte[u.id].spaeter ? "spaeter" : ""}" data-uebung="${esc(u.id)}">${uebungHtml(u)}</div>`;
  }
  if(station!==null) html += `</div>`;
  html += `<div class="augenbraue station">Notiz zum Training</div>
    <div class="karte"><textarea class="text" id="einheit-notiz" placeholder="Optional – z. B. „Bauch & Physio aus Zeitgründen später zu Hause“">${esc(offen.werte._notiz || "")}</textarea></div>
    <div id="rest-bereich">${restKarte()}</div>`;
  $("#app").innerHTML = html;
  $("#einheit-notiz").oninput = ev => { offen.werte._notiz = ev.target.value; merkeEntwurf(); };
  bindeRest();
  $("#zurueck").onclick = kamVonKalender ? zeigeKalender : zeigeHeute;
  bindeKraft();
  $("#leiste").hidden = false;
  setzeStatus();
  $("#speichern").textContent = "Speichern";
  $("#speichern").onclick = speichereKraft;
  window.scrollTo(0,0);
}

// Unter jeder Übung: „Später machen“ und eine kurze Notiz
function extrasHtml(u, w){
  const offenNotiz = w.notiz || w._notizOffen;
  return `<div class="u-extras">
      <button class="chip ${w.spaeter ? "an" : ""}" data-spaeter="${esc(u.id)}">${w.spaeter ? "✓ Später machen" : "Später machen"}</button>
      ${offenNotiz ? "" : `<button class="chip" data-notiz-auf="${esc(u.id)}">+ Notiz</button>`}</div>
    ${offenNotiz ? `<textarea class="text u-notiz" data-notiz="${esc(u.id)}" placeholder="z. B. Knie leicht gemerkt, Gerät besetzt …">${esc(w.notiz || "")}</textarea>` : ""}`;
}
function uebungHtml(u){
  const w = offen.werte[u.id];
  if(u.erfassung==="abhaken"){
    return `<label class="haken"><input type="checkbox" data-haken="${esc(u.id)}" ${w.erledigt?"checked":""}><span class="box"></span><span class="uebung-name">${esc(u.name)}</span></label>${extrasHtml(u, w)}`;
  }
  const letzte = letzteWerte(u.id, offen.eintrag.datum);
  const info = [u.einbeinig ? "pro Bein" : "", letzte ? "Letztes Mal: " + kurz(letzte.saetze) : (u.ziel ? "Vorgabe: " + kurz(u.ziel) : "")].filter(Boolean).join(" · ");
  let zeilen = `<span class="kopfzeile"></span><span class="kopfzeile" style="text-align:center">Wdh</span><span class="kopfzeile" style="text-align:center">kg</span><span></span>`;
  const zahl = x => x===null || x===undefined ? "" : String(x).replace(".", ",");
  w.saetze.forEach((s, i) => {
    // Leerer Satz mit Vorschlag: ✓ übernimmt den Vorschlag; sonst × entfernt den Satz
    const vorschlag = s.wdh===null && s.kg===null && (s.v_wdh!==null && s.v_wdh!==undefined);
    const aktion = vorschlag
      ? `<button class="entf ok" data-ok="${i}" aria-label="Satz ${i+1} wie vorgeschlagen übernehmen">✓</button>`
      : `<button class="entf" data-weg="${i}" aria-label="Satz ${i+1} entfernen">×</button>`;
    zeilen += `<span class="satznr">${i+1}</span>
      <input inputmode="numeric" pattern="[0-9]*" data-satz="${i}" data-feld="wdh" value="${zahl(s.wdh)}" placeholder="${zahl(s.v_wdh)}">
      <input inputmode="decimal" data-satz="${i}" data-feld="kg" value="${zahl(s.kg)}" placeholder="${zahl(s.v_kg)}">
      ${aktion}`;
  });
  return `<div class="uebung-kopf"><span class="uebung-name">${esc(u.name)}</span></div>
    ${info ? `<div class="hinweis">${esc(info)}</div>` : ""}
    <div class="saetze">${zeilen}</div>
    <button class="knopf klein hell satz-plus" data-plus="1">+ Satz</button>${extrasHtml(u, w)}`;
}

function neuZeichnen(id){
  const u = zustand.uebungen[offen.art].uebungen.find(x => x.id===id);
  const karte = document.querySelector(`[data-uebung="${id}"]`);
  karte.innerHTML = uebungHtml(u);
  karte.classList.toggle("spaeter", !!offen.werte[id].spaeter);
  bindeKraft(karte);
}

function bindeKraft(wurzel=document){
  wurzel.querySelectorAll("[data-haken]").forEach(el => el.onchange = () => { const w = offen.werte[el.dataset.haken]; w.erledigt = el.checked; if(el.checked && w.spaeter){ w.spaeter = false; neuZeichnen(el.dataset.haken); } merkeEntwurf(); });
  wurzel.querySelectorAll("[data-uebung]").forEach(karte => bindeKarte(karte));
  wurzel.querySelectorAll("[data-spaeter]").forEach(b => b.onclick = () => {
    const w = offen.werte[b.dataset.spaeter]; w.spaeter = !w.spaeter; if(w.spaeter) w.erledigt = false;
    merkeEntwurf(); neuZeichnen(b.dataset.spaeter);
  });
  wurzel.querySelectorAll("[data-notiz-auf]").forEach(b => b.onclick = () => {
    const id = b.dataset.notizAuf; offen.werte[id]._notizOffen = true; neuZeichnen(id);
    const t = document.querySelector(`[data-notiz="${id}"]`); if(t) t.focus();
  });
  wurzel.querySelectorAll("[data-notiz]").forEach(t => t.oninput = () => { offen.werte[t.dataset.notiz].notiz = t.value; merkeEntwurf(); });
  if(wurzel!==document && wurzel.dataset && wurzel.dataset.uebung) bindeKarte(wurzel);
}
function bindeKarte(karte){
  const id = karte.dataset.uebung;
  const w = offen.werte[id];
  if(!w.saetze) return;
  karte.querySelectorAll("input[data-satz]").forEach(inp => inp.oninput = () => {
    const s = w.saetze[+inp.dataset.satz];
    const roh = inp.value.replace(",", ".").trim();
    s[inp.dataset.feld] = roh==="" ? null : Number(roh);
    merkeEntwurf();
  });
  karte.querySelectorAll("[data-weg]").forEach(k => k.onclick = () => { w.saetze.splice(+k.dataset.weg, 1); merkeEntwurf(); neuZeichnen(id); });
  karte.querySelectorAll("[data-ok]").forEach(k => k.onclick = () => {
    const s = w.saetze[+k.dataset.ok]; s.wdh = s.v_wdh; s.kg = s.v_kg ?? null; merkeEntwurf(); neuZeichnen(id);
  });
  const plus = karte.querySelector("[data-plus]");
  if(plus) plus.onclick = () => {
    const vorher = w.saetze[w.saetze.length-1] || {};
    w.saetze.push({wdh:null, kg:null, v_wdh: vorher.wdh ?? vorher.v_wdh ?? null, v_kg: vorher.kg ?? vorher.v_kg ?? null});
    merkeEntwurf(); neuZeichnen(id);
  };
}

// Übungen, die auf „später“ stehen, als eigene lockere Einheit einplanen (z. B. Pilates/Mobility zu Hause)

function zeigeRest(){ const r = $("#rest-bereich"); if(r){ r.innerHTML = restKarte(); bindeRest(); } }
async function planeRest(tage){
  const namen = restNamen(), e = offen.eintrag;
  const datum = plusTage(e.datum < HEUTE ? HEUTE : e.datum, tage);
  document.querySelectorAll("[data-rest]").forEach(b => b.disabled = true);
  const neu = {id: e.id + "-rest", datum, sport:"mobilitaet", titel:"Rest von " + (kurzTitel(e).replace(/^Gym – /, "")),
    dauer_min: Math.max(15, namen.length * 10), intensitaet:"locker", details: namen, rest_von: e.id, status:"geplant"};
  try{
    zustand.plan = await aendere("daten/plan.json", [], plan => plan.filter(x => x.id!==neu.id).concat(neu)
      .sort((a,b) => a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : 0), `Plan: Rest von ${kurzTitel(e)} am ${datum} eingeplant`);
    zeigeRest();
  }catch(err){
    document.querySelectorAll("[data-rest]").forEach(b => b.disabled = false);
    const f = $("#rest-fehler"); if(f) f.textContent = err.message==="token" ? "Token ungültig." : err.message;
  }
}

let ungespeichert = false;
function merkeEntwurf(){
  schreib(ENTWURF_KEY + offen.eintrag.datum + "_" + offen.art, JSON.stringify(offen.werte));
  ungespeichert = true; setzeStatus(); zeigeRest();
}
function setzeStatus(text){
  const vorhanden = zustand.kraft.find(k => k.datum===offen.eintrag.datum && k.einheit===offen.art);
  $("#status").textContent = text || (ungespeichert ? "Noch nicht gespeichert – Eingaben bleiben auf dem Gerät erhalten." : (vorhanden ? "Gespeichert." : ""));
}

// Nur tatsächlich eingetragene Werte speichern; ein leeres kg-Feld übernimmt den Vorschlag, wenn Wdh eingetragen ist.
function bereinigt(){
  const aus = {};
  for(const [id, w] of Object.entries(offen.werte)){
    if(id.startsWith("_")) continue;
    const x = {};
    if(w.saetze){
      const saetze = w.saetze.filter(s => s.wdh!==null)
        .map(s => { const x = {wdh:s.wdh}; const kg = s.kg!==null ? s.kg : s.v_kg; if(kg!==null && kg!==undefined) x.kg = kg; return x; });
      if(saetze.length) x.saetze = saetze;
    } else if(w.erledigt){ x.erledigt = true; }
    if(w.spaeter) x.spaeter = true;
    if(w.notiz && w.notiz.trim()) x.notiz = w.notiz.trim();
    if(Object.keys(x).length) aus[id] = x;
  }
  return aus;
}

async function speichereKraft(){
  const uebungen = bereinigt();
  const notiz = (offen.werte._notiz || "").trim();
  if(!Object.keys(uebungen).length && !notiz){ setzeStatus("Noch nichts eingetragen."); return; }
  const knopf = $("#speichern"); knopf.disabled = true; setzeStatus("Speichere …");
  const datum = offen.eintrag.datum, art = offen.art;
  try{
    zustand.kraft = await aendere("daten/kraft.json", [], liste => {
      const rest = liste.filter(k => !(k.datum===datum && k.einheit===art));
      const eintrag = {datum, einheit:art, plan_id: offen.eintrag.id, uebungen, gespeichert: new Date().toISOString()};
      if(notiz) eintrag.notiz = notiz;
      rest.push(eintrag);
      return rest.sort((a,b) => a.datum < b.datum ? -1 : 1);
    }, `Kraft-Log ${datum} (${zustand.uebungen[art].name})`);
    schreib(ENTWURF_KEY + datum + "_" + art, null);
    ungespeichert = false;
    // Gespeicherte Werte als echte Werte übernehmen, damit die Ansicht stimmt
    offen.werte = startwerte(art, datum);
    // Offene „später“-Übungen ohne eingeplanten Rest: hierbleiben, damit der Rest eingeplant werden kann
    if(restNamen().length && !restEinheit()){
      zeigeKraftLog(offen.eintrag.id);
      setzeStatus("Gespeichert ✓ – Rest unten einplanen?");
      const r = $("#rest-bereich"); if(r) r.scrollIntoView({behavior:"smooth", block:"center"});
    } else {
      offen = null;
      kamVonKalender ? zeigeKalender() : zeigeHeute();
      meldung("Training gespeichert ✓");
    }
  }catch(err){
    setzeStatus(err.message==="token" ? "Token ungültig – bitte neu einrichten." : err.message);
  }finally{ knopf.disabled = false; }
}

const sync = {laeuft:false, text:"", neu:[]};
function standText(){

// Neuestes geladenes Training im Kalender öffnen (als geplante Einheit, wenn es eine erledigt)
function zeigeNeuesTraining(){
  const a = sync.neu[0];
  sync.neu = []; sync.text = "";
  if(!a) return zeigeKalender();
  const e = zustand.plan.find(x => x.status!=="gestrichen" && erledigtDurch(x)===a);
  auswahl = e ? {typ:"plan", id:e.id} : {typ:"akt", id:a.id};

function zeigeSync(){ const b = $("#sync"); if(b){ b.className = "sync" + (sync.laeuft?" laeuft":""); b.disabled = sync.laeuft; b.innerHTML = syncText(); } }
function ansichtNeu(){ ({kalender:zeigeKalender, fortschritt:zeigeFortschritt}[zustand.ansicht] || zeigeHeute)(); }
async function ghActions(pfad, opt={}){
  return fetch("https://api.github.com/repos/" + REPO + "/actions/" + pfad, {method: opt.method || "GET", cache:"no-store",
    headers:{"Authorization":"Bearer "+token(), "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"},
    body: opt.body ? JSON.stringify(opt.body) : undefined});
}
async function holeTrainings(){
  if(sync.laeuft) return;
  sync.laeuft = true; sync.neu = []; sync.text = "Starte Abruf …"; zeigeSync();
  const gestartet = Date.now() - 60000;
  try{
    const res = await ghActions("workflows/abruf.yml/dispatches", {method:"POST", body:{ref:"main"}});
    if(res.status===403 || res.status===404) throw new Error("rechte");
    if(!res.ok) throw new Error("GitHub antwortet mit " + res.status);
    sync.text = "Hole Trainings von Garmin …"; zeigeSync();
    let fertig = null;
    for(let i=0; i<40 && !fertig; i++){
      await new Promise(r => setTimeout(r, i<2 ? 8000 : 5000));
      const r = await ghActions("workflows/abruf.yml/runs?event=workflow_dispatch&per_page=5");
      if(!r.ok) continue;
      const lauf = (await r.json()).workflow_runs.find(l => new Date(l.created_at).getTime() >= gestartet);
      if(lauf && lauf.status==="completed") fertig = lauf;
    }
    if(!fertig) throw new Error("Dauert länger als üblich – schau in ein paar Minuten nochmal.");
    if(fertig.conclusion!=="success") throw new Error("Abruf hat nicht geklappt – evtl. ist Garmin gerade nicht erreichbar.");
    const bekannt = new Set(zustand.aktivitaeten.map(a => String(a.id)));
    await ladeAlles();
    sync.neu = zustand.aktivitaeten.filter(a => !bekannt.has(String(a.id)) && a.sport!=="wechsel")
      .sort((a, b) => (a.start || a.datum) < (b.start || b.datum) ? 1 : -1);
    const neu = sync.neu.length;
    sync.laeuft = false;
    sync.text = neu > 0 ? `${neu} neue${neu===1?"s":""} Training${neu===1?"":"s"} geladen` : "Aktuell – nichts Neues";
    ansichtNeu();
  }catch(err){
    sync.laeuft = false;
    sync.text = err.message==="rechte" ? "Token braucht „Actions: Read and write“" : err.message;
    zeigeSync();
  }
}

// ---------- Regeln (aus einstellungen.json, wie im Konzept) ----------
const SPORT_NAMEN = {laufen:"Laufen", rad:"Rad", schwimmen:"Schwimmen", kraft:"Kraft", mobilitaet:"Mobility", sonstiges:"Sonstiges"};
function tageZwischen(a, b){ return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 864e5); }
function regeln(){ return (zustand.einstellungen.regeln) || {}; }
const istTagA = e => e.art==="kraft_tag_a";
const istSchwelle = e => e.art==="rad_schwelle";
const istLauf = e => e.sport==="laufen";
function istSchwer(e){
  const schwer = regeln().schwere_einheiten || ["kraft_tag_a","rad_schwelle","langer_lauf"];
  return schwer.includes(e.art) || (e.intensitaet==="hart" && ["laufen","rad","kraft"].includes(e.sport));
}
// Laufdistanz: geplant oder aus der Dauer bei lockerem Tempo (ca. 7:35 min/km) geschätzt
function laufKm(e){ return e.distanz_km ?? (e.dauer_min ? e.dauer_min / 7.6 : 0); }
function kurzTitel(e){ return e.titel || SPORT_NAMEN[e.sport] || "Einheit"; }

// Verstöße zwischen zwei Einheiten; a liegt am selben Tag oder vor b
function paarVerstoesse(a, b){
  const t = tageZwischen(a.datum, b.datum), out = [];
  const r = regeln(), schwelle = r.abstand_rad_schwelle_zu_lauf || {lauf_bis_km:5};
  if(t===0){
    if((istTagA(a) && istLauf(b)) || (istTagA(b) && istLauf(a)))
      out.push(`Lauf und Tag A am selben Tag – zwischen Tag A und Lauf sollten mind. ${r.abstand_tag_a_zu_lauf_h || 10} h liegen.`);
    if((istSchwelle(a) && istLauf(b)) || (istSchwelle(b) && istLauf(a)))
      out.push("Lauf und Rad-Schwelle am selben Tag – mind. 10 h Abstand nötig.");
    else if(istSchwer(a) && istSchwer(b) && !(istTagA(a)&&istLauf(b)) && !(istTagA(b)&&istLauf(a)))
      out.push(`Zwei schwere Einheiten am selben Tag (${kurzTitel(a)} und ${kurzTitel(b)}).`);
  }
  if(t>0){
    if(istSchwelle(a) && istLauf(b) && laufKm(b) > schwelle.lauf_bis_km && t < 2)
      out.push(`Lauf über ${schwelle.lauf_bis_km} km direkt nach der Rad-Schwelle – dazwischen sollte ein Tag liegen.`);
    if(istSchwer(a) && istSchwer(b) && t===1)
      out.push(`Zwei schwere Beintage hintereinander (${kurzTitel(a)} und ${kurzTitel(b)}).`);
  }
  return out;
}
// Alle Verstöße, die eine Einheit an einem Zieldatum hätte
function verstoesse(e, ziel, liste=zustand.plan){
  const neu = {...e, datum: ziel};
  const andere = liste.filter(x => x.id!==e.id && x.status!=="gestrichen" && Math.abs(tageZwischen(x.datum, ziel)) <= 2);
  const out = [];
  for(const o of andere){
    const [a, b] = tageZwischen(o.datum, ziel) >= 0 ? [o, neu] : [neu, o];
    out.push(...paarVerstoesse(a, b));
  }
  return [...new Set(out)];
}
// Nächstgelegener Tag ohne Regelverstoß (erst nach vorne, dann zurück), nicht vor "fruehestens"
function naechsterFreierTag(e, ziel, bisher){
  const fruehestens = plusTage(bisher || ziel, -7);
  for(let k=1; k<=7; k++){
    for(const d of [plusTage(ziel, k), plusTage(ziel, -k)]){
      if(d >= fruehestens && d!==bisher && !verstoesse(e, d).length) return d;
    }
  }
  return null;
}

// ---------- Kalender ----------
let wochenVersatz = 0;
let auswahl = null;  // {typ:"plan"|"akt", id}
function montag(iso){ const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate() - (d.getDay()+6)%7); return isoDatum(d); }
function datumKurz(iso){ const d = new Date(iso+"T12:00:00"); return WOCHENTAGE[d.getDay()] + " " + iso.slice(8,10) + "." + iso.slice(5,7) + "."; }
function erledigtDurch(e){
  if(e.datum > HEUTE) return null;
  return zustand.aktivitaeten.find(a => a.datum===e.datum && a.sport===e.sport) || null;
}

function zeigeKalender(){
  $("#leiste").hidden = true;
  const start = plusTage(montag(HEUTE), 7*wochenVersatz);
  const tage = [...Array(7)].map((_, i) => plusTage(start, i));
  const kw = (() => { const d = new Date(start+"T12:00:00"); d.setDate(d.getDate()+3); const j = new Date(d.getFullYear(),0,4);
    return 1 + Math.round(((d - j) / 864e5 - 3 + (j.getDay()+6)%7) / 7); })();
  // Ohne gültige Auswahl: nächste anstehende Einheit der Woche (sonst die erste)
  const inWoche = zustand.plan.filter(e => tage.includes(e.datum));
  const gueltig = auswahl && (auswahl.typ==="plan" ? inWoche.some(e => e.id===auswahl.id)
    : auswahl.typ==="ruhe" ? tage.includes(auswahl.id)
    : zustand.aktivitaeten.some(a => String(a.id)===String(auswahl.id) && tage.includes(a.datum)));
  if(!gueltig){
    const naechste = inWoche.filter(e => e.datum>=HEUTE && e.status!=="gestrichen")[0] || inWoche[0];
    auswahl = naechste ? {typ:"plan", id:naechste.id} : null;
  }
  let spalten = "";
  for(const d of tage){
    const geplant = zustand.plan.filter(e => e.datum===d);
    const akt = zustand.aktivitaeten.filter(a => a.datum===d && a.sport!=="wechsel");
    const zugeordnet = new Set(geplant.map(erledigtDurch).filter(Boolean));
    const extra = akt.filter(a => !zugeordnet.has(a));
    let inhalt = geplant.map(e => kalenderEinheit(e)).join("");
    inhalt += extra.map(a => `<button class="k-akt ${auswahl && auswahl.typ==="akt" && String(auswahl.id)===String(a.id) ? "gewaehlt" : ""}" data-akt-id="${esc(a.id)}"><span class="punkt" style="background:${SPORT_FARBEN[a.sport]||"#BDB7AD"}"></span>
      <span class="k-text"><span class="k-titel">${esc(SPORT_NAMEN[a.sport]||a.sport)}</span><span class="k-meta">✓ ${Math.round(a.dauer_min||0)} min</span></span></button>`).join("");
    if(!inhalt) inhalt = `<button class="k-ruhe ${auswahl && auswahl.typ==="ruhe" && auswahl.id===d ? "gewaehlt" : ""}" data-ruhe="${d}">Ruhetag</button>`;
    spalten += `<div class="k-tag ${d===HEUTE?"heute":""} ${d<HEUTE?"vorbei":""}">
      <div class="k-kopf"><span>${datumKurz(d)}</span><button class="k-plus" data-neu="${d}" aria-label="Einheit hinzufügen">+</button></div>
      ${inhalt}</div>`;
  }
  $("#app").innerHTML = `${reiter("kalender")}
    <div class="k-nav"><button class="knopf klein hell" id="k-zurueck" aria-label="Vorige Woche">‹</button>
      <h1 style="margin:0">KW ${kw}</h1>
      <button class="knopf klein hell" id="k-vor" aria-label="Nächste Woche">›</button>
      ${wochenVersatz ? `<button class="link" id="k-heute">Diese Woche</button>` : ""}
      <button class="knopf klein" id="k-planen" style="margin-left:auto">Woche planen</button></div>
    <div class="k-woche">${spalten}</div>
    <p class="klein-grau" style="text-align:center;margin:10px 0 16px">Tippe auf eine Einheit für Details. ✓ = laut Garmin erledigt.</p>
    <div id="k-detail">${detailKarte()}</div>`;
  bindeReiter();
  $("#k-zurueck").onclick = () => { wochenVersatz--; zeigeKalender(); };
  $("#k-vor").onclick = () => { wochenVersatz++; zeigeKalender(); };
  if($("#k-heute")) $("#k-heute").onclick = () => { wochenVersatz = 0; zeigeKalender(); };
  $("#k-planen").onclick = zeigeWochenplanung;
  const waehle = (neu) => {
    auswahl = neu; zeigeKalender();
    const d = $("#k-detail"); if(d && window.innerWidth < 900) d.scrollIntoView({behavior:"smooth", block:"start"});
  };
  document.querySelectorAll("[data-einheit]").forEach(el => el.onclick = () => waehle({typ:"plan", id:el.dataset.einheit}));
  document.querySelectorAll("[data-akt-id]").forEach(el => el.onclick = () => waehle({typ:"akt", id:el.dataset.aktId}));
  document.querySelectorAll("[data-ruhe]").forEach(el => el.onclick = () => waehle({typ:"ruhe", id:el.dataset.ruhe}));
  document.querySelectorAll("[data-neu]").forEach(el => el.onclick = () => oeffneNeu(el.dataset.neu));
  bindeDetail();
}
